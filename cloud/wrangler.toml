# The cloud-save worker (docs/wave-cloud.md; README.md here for the deploy).
# Workers Free plan, no card on file: past the free limits Cloudflare refuses
# requests instead of billing for them.
name = "pebble-cloud"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Served on the owner's own domain, not workers.dev.
workers_dev = false
routes = [{ pattern = "pebble-saves.graham-things.com", custom_domain = true }]

# The kill switch. `npx wrangler deploy --var CLOUD_PAUSED:1` answers every
# route 503 with a day's Retry-After before D1 is touched.
[vars]
CLOUD_PAUSED = "0"

# STATS_TOKEN and PAIR_PEPPER are secrets: `npx wrangler secret put <name>`.

[[d1_databases]]
binding = "DB"
database_name = "pebble-cloud"
database_id = "ee0968c5-8a6b-4fa3-acb6-7eee8cb4bf03"
# The same files cloud/test/d1.mjs builds its database from.
migrations_dir = "migrations"

# The daily sweep, at an hour when nobody is near the day caps' midnight.
[triggers]
crons = ["17 3 * * *"]
