<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>clouds</title>
<style>
  /* The cloud bench: a whole liquid sky drawn through the real modules
     (src/render/clouds.js for the clouds, src/render/cloudgl.js for the
     field on the graphics card) at the size the yard's camera draws a cell,
     with a strip of the yard beside it (a worker, a station, the rock, the
     ground line) so a cloud is judged at the size it will be seen. Every
     layer alone, the ground, the clickable clouds, or all of it together, on
     either page, in each treatment. Nothing here is the game; the clouds are. */
  body { margin: 0; background: #fff; color: #000; font: 12px/1.4 ui-monospace, "Courier New", monospace; }
  body.dark { background: #121212; color: #d6d6d6; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; }
  .bar label { display: flex; gap: 5px; align-items: center; }
  .bar b { letter-spacing: .18em; text-transform: uppercase; }
  canvas { display: block; image-rendering: pixelated; }
  .stats { white-space: pre; padding: 6px 12px; opacity: .7; }
</style>
</head>
<body>
<div class="bar">
  <b>clouds</b>
  <label>show <select id="show">
    <option value="all">the whole sky</option><option value="l0">layer 0 (horizon)</option><option value="l1">layer 1</option>
    <option value="l2">layer 2</option><option value="l3">layer 3</option><option value="l4">layer 4 (nearest)</option>
    <option value="ground">ground</option><option value="puffs">clickable clouds</option></select></label>
  <label>window <select id="win"><option value="2000x967">2000 x 967</option><option value="800x600">800 x 600</option></select></label>
  <label><input type="checkbox" id="dark"> dark</label>
  <label>treatment <select id="treat">
    <option value="A">A: one tone</option><option value="B">B: undersides</option>
    <option value="C" selected>C: every belly</option><option value="D">D: C and the rim</option></select></label>
  <label><input type="checkbox" id="ref" checked> yard strip</label>
  <label>camera <input type="range" id="cam" min="0" max="600" step="0.1" value="0"></label>
  <label><input type="checkbox" id="auto" checked> slide</label>
  <label>slide <input type="range" id="slide" min="0" max="40" step="0.5" value="3"> <span id="slideV"></span> cells/s</label>
  <label>time <input type="range" id="speed" min="0" max="20" step="0.5" value="1"> <span id="speedV"></span>x</label>
  <label><input type="checkbox" id="sync"> wait for the card (timing)</label>
</div>
<canvas id="c"></canvas>
<div class="stats" id="stats"></div>
<script type="module">
import { CLOUDS_SKY } from '/src/config/clouds.js';
import { skyLayer, groundLayer, cloudLayer, layerLook, sumsAt, tierOf } from '/src/render/clouds.js';
import { skyGL } from '/src/render/cloudgl.js';

const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
// A cell as the yard's camera draws it at its default zoom (CELL in
// config/yard.js) on a one-to-one screen: five pixels.
const CELLPX = 5;
// The yard strip, measured off the yard scene at 2000 x 967 (look.mjs crew):
// the ground line 727 px down, so 48 cells of ground under it; a worker three
// cells wide and six tall with the hat; the rock about forty cells across.
const YARD = { groundUp: 48, worker: [3, 6], station: [24, 16], rock: [40, 18] };
const PUFFS = 3;

const gpu = skyGL();
let W = 2000, H = 967, cols, rows, layers = [], ground, puffs = [], t = 0, cam = 0, manual = false, looks = new Map();
let placed = {}, frames = 0;

function build() {
  cv.width = W; cv.height = H;
  cols = Math.ceil(W / CELLPX); rows = Math.ceil(H / CELLPX);
  const round = Math.max(cols * 2, 700);
  layers = Array.from({ length: CLOUDS_SKY.layers }, (_, i) => skyLayer({ i, seed: 7, W: round }));
  ground = groundLayer({ seed: 7, W: round });
  puffs = Array.from({ length: PUFFS }, (_, i) => ({
    layer: cloudLayer({ kind: ['cumulus', 'heap', 'tower'][i % 3], R: 6 + 2 * i, seed: 31 + i }),
    x0: 60 + i * (cols + 80) / PUFFS, row: 0.32 + 0.08 * (i % 2), fade: 1, gone: false, back: 0 }));
  looks.clear();
}
function look(layer) {
  let L = looks.get(layer);
  if (!L) { L = layerLook(layer, { page: page(), treat: $('treat').value }); looks.set(layer, L); }
  return L;
}
const page = () => ($('dark').checked ? 'dark' : 'light');
const show = () => $('show').value;

// Where things stand, in cells: the horizon where the ground's back row
// tops out; each layer's base line its share of the sky over that.
function horizon() { return rows - ground.h + 2; }
const scroll = P => cam * P.parallax + P.wind * t;

const stat = { cpu: [], frame: [] };
function frame(dt) {
  const t0 = performance.now();
  frames++;
  t += dt * +$('speed').value;
  if ($('auto').checked) { cam += dt * +$('slide').value; $('cam').value = cam % 600; } else cam = +$('cam').value;
  for (const p of puffs) {
    if (p.gone) { p.fade = Math.max(0, p.fade - dt); if (!p.fade && (p.back -= dt) <= 0) { p.gone = false; p.x0 -= 70; } }
    else p.fade = Math.min(1, p.fade + dt / 1.5);
  }
  const s = show(), hz = horizon(), views = [], draws = [];
  const want = k => s === 'all' || s === k;
  layers.forEach((L, i) => {
    if (!want('l' + i)) return;
    const sc = scroll(L.P), ox = Math.floor(sc);
    const top = hz - Math.round(L.P.rise * hz) - L.baseRow;
    views.push({ key: 'l' + i, layer: L, ox, w: cols + 2, h: L.h, look: look(L), every: L.P.every, idle: (frames + i) % L.P.every !== 0 });
    draws.push({ key: 'l' + i, x: (ox - sc) * CELLPX, y: top * CELLPX, alpha: 1 });
  });
  if (want('puffs')) {
    const span = (cols + 80) * CELLPX;
    puffs.forEach((p, i) => {
      const x = (((p.x0 - scroll(p.layer.P)) * CELLPX % span) + span) % span - 40 * CELLPX;
      const y = Math.round(rows * p.row) - p.layer.baseRow;
      views.push({ key: 'p' + i, layer: p.layer, ox: 0, w: p.layer.w, h: p.layer.h, look: look(p.layer) });
      draws.push({ key: 'p' + i, x, y: y * CELLPX, alpha: p.fade });
      p.at = [x, y];
    });
  }
  if (want('ground')) {
    const sc = scroll(ground.P), ox = Math.floor(sc);
    views.push({ key: 'g', layer: ground, ox, w: cols + 2, h: ground.h, look: look(ground) });
    draws.push({ key: 'g', x: (ox - sc) * CELLPX, y: (rows - ground.h) * CELLPX, alpha: 1 });
  }
  const r = gpu.render(views, t, dt * +$('speed').value);
  if ($('sync').checked) gpu.gl.finish();
  const t1 = performance.now();
  g.imageSmoothingEnabled = false;
  g.globalAlpha = 1;
  g.fillStyle = page() === 'dark' ? '#121212' : '#ffffff'; g.fillRect(0, 0, W, H);
  placed = {};
  draws.forEach((d, i) => {
    const a = r.at[i], x = Math.round(d.x), y = Math.round(d.y);
    placed[d.key] = x - views[i].ox * CELLPX;   // where the layer's own first cell is drawn
    placed[d.key + ':ox'] = views[i].ox;          // and the first column of its window
    g.globalAlpha = d.alpha;
    g.drawImage(r.canvas, 0, a.y, a.w, a.h, x, y, a.w * CELLPX, a.h * CELLPX);
  });
  g.globalAlpha = 1;
  if ($('ref').checked && s === 'all') yardStrip();
  stat.cpu.push(t1 - t0); stat.frame.push(performance.now() - t0);
  if (stat.cpu.length > 4000) { stat.cpu.shift(); stat.frame.shift(); }
  if ((Math.round(t * 60) % 20 === 0) || dt === 0) report(r);
}

// The yard at its own scale, bottom left: what a cloud is measured against.
function yardStrip() {
  const C = CELLPX, ink = page() === 'dark' ? '#d6d6d6' : '#000000', gy = H - YARD.groundUp * C;
  g.fillStyle = ink;
  g.fillRect(0, gy, 140 * C, C);
  const [rw, rh] = YARD.rock;
  for (let i = 0; i < rw; i++) { const h = Math.round(rh * Math.sqrt(1 - ((i - rw / 2) / (rw / 2)) ** 2)); g.fillRect((8 + i) * C, gy - h * C, C, h * C); }
  const [sw, shh] = YARD.station;
  g.fillRect(70 * C, gy - shh * C, sw * C, shh * C);
  g.fillStyle = page() === 'dark' ? '#121212' : '#ffffff';
  g.fillRect(72 * C, gy - (shh - 2) * C, (sw - 4) * C, (shh - 4) * C);
  g.fillStyle = ink;
  for (const x of [52, 58, 100, 112]) { const [ww, wh] = YARD.worker; g.fillRect(x * C, gy - wh * C, ww * C, wh * C); }
  g.font = '12px ui-monospace, monospace';
  g.fillText('yard at its own scale: rock, workers, a station, the ground line', 4, gy + 20);
}

function report(r) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return (s[Math.floor(p * (s.length - 1))] || 0).toFixed(2); };
  $("stats").textContent = `upload ${r.uploadMs.toFixed(2)} ms  |  main thread ${q(stat.cpu, 0.5)} ms median, ${q(stat.cpu, 0.95)} p95, ${q(stat.cpu, 1)} max (puffs moved and sent, passes queued` +
    `${$('sync').checked ? ', waited for the card' : ''})  |  ${r.puffs} puffs in view\n` +
    layers.map((L, i) => `layer ${i}: ${L.puffs.length} puffs, size ${L.P.R.toFixed(1)}, ${L.h} rows, parallax ${L.P.parallax.toFixed(2)}`).join('\n');
}

let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!manual) frame(dt); requestAnimationFrame(loop); }

cv.addEventListener('click', e => {
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  for (const p of puffs) if (!p.gone && p.at) {
    const cx = Math.floor((x - p.at[0]) / CELLPX), cy = Math.floor(y / CELLPX) - p.at[1];
    if (cx >= 0 && cy >= 0 && cx < p.layer.w && cy < p.layer.h && tierOf(sumsAt(p.layer, t, cx, cy)) >= 0) { p.gone = true; p.back = 3; return; }
  }
});
function restyle() { document.body.classList.toggle('dark', page() === 'dark'); looks.clear(); }
for (const id of ['dark', 'treat']) $(id).onchange = restyle;
$('win').onchange = () => { [W, H] = $('win').value.split('x').map(Number); build(); };
const vals = () => { $('slideV').textContent = $('slide').value; $('speedV').textContent = $('speed').value; };
$('slide').oninput = vals; $('speed').oninput = vals; vals();

const qs = new URLSearchParams(location.search);
if (qs.has('dark')) $('dark').checked = true;
if (qs.get('win')) $('win').value = qs.get('win');
if (qs.get('show')) $('show').value = qs.get('show');
if (qs.get('treat')) $('treat').value = qs.get('treat');
manual = qs.has('manual');
[W, H] = $('win').value.split('x').map(Number);
if (!gpu) $('stats').textContent = 'this page has no WebGL2: the liquid sky needs it';
else { build(); restyle(); frame(0); requestAnimationFrame(loop); }

// Handles for the headless checks (tools/clouds-check.mjs).
window.bench = {
  frame, gpu,
  set(o) {
    if ('t' in o) t = o.t; if ('cam' in o) cam = o.cam;
    for (const k of ['speed', 'slide']) if (k in o) $(k).value = o[k];
    for (const k of ['auto', 'ref', 'dark', 'sync']) if (k in o) $(k).checked = o[k];
    for (const k of ['show', 'treat']) if (k in o) $(k).value = o[k];
    if ('win' in o && o.win !== $('win').value) { $('win').value = o.win; [W, H] = o.win.split('x').map(Number); build(); }
    if (o.rebuild) build();
    if (o.fresh) { stat.cpu.length = 0; stat.frame.length = 0; }
    restyle();
  },
  // a window's drawn tones, for the flicker check
  tones: key => { const L = { l0: 0, l1: 1, l2: 2, l3: 3, l4: 4 }[key]; const layer = key === 'g' ? ground : layers[L]; return gpu.tonesOf(key, look(layer).tone); },
  placed: () => placed,
  layers: () => layers,
  pxRows: () => { const d = g.getImageData(0, 0, W, H).data, n = Math.floor(H / CELLPX), out = new Uint8Array(n * W);
    for (let y = 0; y < n; y++) for (let x = 0; x < W; x++) out[y * W + x] = d[((y * CELLPX + 2) * W + x) * 4 + 1];
    return Array.from(out); },
  timings: () => ({ cpu: stat.cpu.slice(), frame: stat.frame.slice() }),
  stats: () => $('stats').textContent
};
</script>
</body>
</html>
