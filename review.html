<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --bg: #fff; --fg: #000; --dim: #666; --soft: #eee; --line: #000; --hair: #bbb; }
  :root[data-theme=dark] { color-scheme: dark; --bg: #000; --fg: #fff; --dim: #9a9a9a; --soft: #161616; --line: #fff; --hair: #444; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 32px; background: var(--bg); color: var(--fg); font: 13px/1.45 'Courier Prime', ui-monospace, Menlo, monospace;
    background-image: radial-gradient(var(--hair) 1px, transparent 1px); background-size: 12px 12px; }
  h1 { font-size: 14px; margin: 0; }
  button { font: inherit; border: 2px solid var(--line); background: var(--bg); color: var(--fg); padding: 1px 9px; cursor: pointer; }
  button.on { background: var(--fg); color: var(--bg); }
  .dim { color: var(--dim); }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .hint { color: var(--dim); font-size: 11px; }
  /* the board: a column a status, a card a review */
  .kan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
  .col { border: 2px solid var(--line); min-height: 90px; display: flex; flex-direction: column; background: var(--bg); }
  .col > header { padding: 3px 8px; border-bottom: 2px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; }
  .col.hot > header { background: var(--fg); color: var(--bg); }
  .cards { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .card { border: 1px solid var(--line); padding: 5px 7px; background: var(--bg); cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: block; }
  .card.sel { outline: 3px solid var(--fg); outline-offset: 1px; }
  .card.phantom { cursor: default; border-style: dashed; }
  .card .t { font-weight: 700; line-height: 1.25; }
  .card .w { font-size: 11px; color: var(--dim); margin: 2px 0 4px; }
  .landedrow { border: 1px solid var(--hair); padding: 4px 8px; color: var(--dim); margin-bottom: 10px; font-size: 12px; background: var(--bg); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .landedrow button { font-size: 11px; padding: 0 8px; border-width: 1px; }
  .landedrow .lr { border: 1px dashed var(--hair); color: var(--dim); }
  .landedrow .lr.sel { background: var(--dim); color: var(--bg); }
  /* a status, said in the pill's own edge */
  .pill { display: inline-block; padding: 0 7px; border: 2px solid var(--line); font-weight: 700; font-size: 11px; line-height: 1.45; white-space: nowrap; letter-spacing: .03em; }
  .s-waiting { background: var(--fg); color: var(--bg); }
  .s-iterating { border-style: dashed; }
  .s-building { border-style: dotted; border-width: 3px; padding: 0 5px; }
  .s-signed { border-color: var(--dim); }
  .s-signed:before { content: "\2713 "; }
  .s-landed { border-color: var(--hair); color: var(--dim); font-weight: 400; }
  .s-iterating:after, .s-building:after { content: "..."; display: inline-block; width: 0; overflow: hidden; vertical-align: bottom; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { to { width: 1.8em; } }
  .mk { display: inline-block; padding: 0 4px; border: 1px solid var(--line); font-size: 10px; font-weight: 700; }
  .mk.built { background: var(--fg); color: var(--bg); }
  button.on .mk { border-color: var(--bg); background: var(--bg); color: var(--fg); }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); padding: 0 6px; font-size: 11px; background: var(--bg); margin: 0 3px 3px 0; }
  .chip.rebuild { border-style: dashed; }
  .chip { max-width: 100%; }
  .chip .cl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em; }
  .chip .mk { font-size: 9px; padding: 0 3px; }
  /* NEW or UPDATED since this browser last looked: in the ink around it, so it reads on a pressed button too */
  .flag { display: inline-block; margin-left: 4px; padding: 0 4px; border: 2px solid currentColor; font-weight: 700; font-size: 10px; line-height: 1.3; }
  .flag.new { background: var(--fg); color: var(--bg); }
  button.on .flag.new { background: var(--bg); color: var(--fg); }
  .stale { margin-left: 4px; font-weight: 700; border: 1px dashed currentColor; padding: 0 3px; font-size: 10px; }
  /* the open review */
  .detail { border: 2px solid var(--line); padding: 10px 12px; background: var(--bg); margin-bottom: 8px; }
  .detail h2 { margin: 0 0 4px; font-size: 14px; }
  .detail h2 .dim { font-weight: 400; font-size: 13px; }
  .flight { border-left: 4px solid var(--line); padding: 2px 10px; margin: 6px 0 8px; background: var(--soft); }
  .flight.none { border-left-color: var(--hair); color: var(--dim); }
  #stage-say { margin: 0 0 6px; }
  .tag { display: inline-block; padding: 0 6px; margin-right: 6px; border: 2px solid var(--line); font-weight: 700; }
  .tag.mock { border-style: dashed; }
  .tag.built { background: var(--fg); color: var(--bg); }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .bar button.rebuild { border-style: dashed; }
  #say { margin: 0 0 8px; max-width: 900px; min-height: 2.8em; line-height: 1.4; }
  .note { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 8px; max-width: 1100px; }
  .note textarea { flex: 1 1 320px; font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--line); padding: 4px 8px; min-height: 3.4em; resize: vertical; }
  .note .btns { display: flex; flex-direction: column; gap: 4px; }
  #sent { align-self: center; min-width: 12em; }
  .hist { font-size: 11px; color: var(--dim); }
  .hist b { color: var(--fg); }
  .stage { border: 2px solid var(--line); overflow: hidden; }
  iframe { border: 0; display: block; background: #fff; width: 800px; height: 600px; transform-origin: 0 0; }
  .empty { border: 2px dashed var(--line); padding: 16px; max-width: 700px; background: var(--bg); }
  @media (max-width: 900px) { .kan { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style></head><body>
<!-- The review bench: the change under review, live in the real game, an
     option a button. A review is the scenes in src/scenes.js that carry a
     `review` (the question) and an `option` (the button's label, "A quarters");
     the option's `say` is the line under the buttons. Nothing about any one
     review lives in this file, so the next review is a few scenes, not a
     page. The frame is play.html?bench: the dev build, staged from boot, so
     it never touches the save. The address is the review and the option
     (#<review>/<scene>), so a link stands the same option up again.

     The top is a board, a column a status and a card a review:
       waiting on you  derived: nothing in flight and the newest print is newer than the owner's last note (or there is no note)
       iterating       derived: the last note is "keep" and no newer print yet; or written (status.json, "iterating")
       building        written: tools/review-status.mjs, set on dispatch and cleared when the agent reports
       signed off      derived: the last note is "stop"
       landed          derived: the review's branches are on main (tools/review-prints.mjs); folded away
     The server answers GET /__review/status with the written entries and the
     owner's notes; the page asks again every few seconds.

     The box under the buttons is the owner's decision: stop on the option on
     screen, or keep going with what to change. It posts to the dev server
     (tools/review-server.mjs), which writes it where an agent waits for it
     (tools/review-wait.mjs).
     Each card and option button says NEW or UPDATED when it changed since
     this browser last looked at it, and each card how long ago it last
     changed. The dev server fingerprints every option from its scene and
     its review's tagged code (tools/review-prints.mjs); what this browser
     has seen is kept here, in localStorage. -->
<div class="topbar"><h1>Review Bench</h1><span><span class="hint" id="hint"></span> <button id="theme" title="light or dark">light / dark</button></span></div>
<div id="board"></div>
<div class="detail" id="detail">
  <div id="head"></div>
  <p id="stage-say"></p>
  <div class="bar" id="bar"></div>
  <p id="say"></p>
  <form class="note" id="note"><textarea id="words" placeholder="what to change (or why this one)"></textarea><div class="btns"><button type="button" id="stop">stop: pick this one</button><button type="button" id="keep">keep iterating</button></div><span id="sent" aria-live="polite"></span></form>
  <div class="hist" id="hist"></div>
</div>
<div class="stage" id="stage"><iframe id="yard" src="./play.html?bench" title="the change under review"></iframe></div>
<script>
const $ = id => document.getElementById(id);
const f = $('yard'), stage = $('stage');
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// The game at the scene shots' 800x600, so the camera frames a scene as
// look.mjs does, scaled to the window.
const fit = () => { const w = Math.min(innerWidth - 36, Math.max(520, (innerHeight - 120) * 4 / 3)), k = w / 800; f.style.transform = `scale(${k})`; stage.style.width = w + 'px'; stage.style.height = 600 * k + 'px'; };
addEventListener('resize', fit); fit();

// light or dark: the system's, until the owner picks
const THEME = 'review-theme';
const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME, t); } catch {} };
{ let t = null; try { t = localStorage.getItem(THEME); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let reviews = [], rev = null, cur = null;
const ready = () => f.contentWindow && f.contentWindow.__reviews && f.contentWindow.__reset;
// An option's stage, from its scene's `stage` ("built: ..." or "mock: ..."): 'built', 'mock' or null.
const kindOfStage = st => /^built/i.test(st || '') ? 'built' : /^mock/i.test(st || '') ? 'mock' : null;
const optKind = (r, o) => kindOfStage(o.stage) || kindOfStage(r.options[0]?.stage);
const parse = () => { const [r, s] = decodeURIComponent(location.hash.slice(1)).split('/'); return { r, s }; };

// --- what changed since this browser last looked ---------------------------
// `printed` is the dev server's answer: each option's and each review's
// fingerprint and when it first appeared. `seen` is the print this browser
// last looked at, per review and per option. Without a server answer (a
// plain dev server, or an old one) there are no marks rather than wrong ones.
const SEEN = 'review-seen';
let printed = null, seen = { rev: {}, opt: {} };
try { seen = { rev: {}, opt: {}, ...JSON.parse(localStorage.getItem(SEEN) || '{}') }; } catch {}
const keepSeen = () => { try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch {} };
// What stood when the page loaded keeps the mark it loaded with until the
// owner moves off it: the reload an edit brings would otherwise clear the
// very mark that says the picture in front of them is new.
const held = { rev: null, opt: null };
const flagOf = (was, p) => !p ? null : was == null ? 'new' : was !== p.fp ? 'updated' : null;
const revFlag = r => held.rev?.key === slug(r.name) ? held.rev.flag : flagOf(seen.rev[slug(r.name)], printed?.reviews[slug(r.name)]);
const optFlag = o => held.opt?.key === o.scene ? held.opt.flag : flagOf(seen.opt[o.scene], printed?.options[o.scene]);
const flagHtml = f => f ? `<span class="flag ${f}">${f.toUpperCase()}</span>` : '';
const ago = iso => {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`;
};
const span = iso => { const m = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 60e3)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const hhmm = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
// Marks one review or option seen at its current print, holding the mark on
// screen when it is the one the page loaded on.
function look(kind, key, p, first) {
  if (!p) return;
  if (kind === 'rev') held.rev = first ? { key, flag: flagOf(seen.rev[key], p) } : null;
  else held.opt = first ? { key, flag: flagOf(seen.opt[key], p) } : null;
  seen[kind][key] = p.fp; keepSeen();
}
async function fetchPrints() {
  try {
    const r = await fetch('/__review/prints', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ reviews: reviews.map(x => ({ slug: slug(x.name), name: x.name, branches: x.branches, supersedes: x.supersedes,
        options: x.options.map(o => ({ scene: o.scene, text: o.text })) })) }) });
    printed = r.ok ? await r.json() : null;
  } catch { printed = null; }
}
// What agents are doing (written) and what the owner has said (notes).
let info = { entries: [], notes: [] };
async function fetchInfo() {
  try { const r = await fetch('/__review/status', { cache: 'no-store' }); if (r.ok) info = await r.json(); } catch {}
}

// --- status ------------------------------------------------------------------
// A review whose build is on main (or that a built review supersedes) has
// put itself away: folded into the landed row unless the owner asks for the
// landed ones back. The server says which (tools/review-prints.mjs).
const LANDED = 'review-show-landed';
let showLanded = false;
try { showLanded = localStorage.getItem(LANDED) === '1'; } catch {}
const landedOf = x => printed?.landed?.[slug(x.name)];
const isLanded = x => !!landedOf(x)?.landed;
const STALE_MS = 2 * 3600e3;
const LBL = { waiting: 'WAITING ON YOU', iterating: 'ITERATING', building: 'BUILDING', signed: 'SIGNED OFF', landed: 'LANDED' };
const notesOf = x => info.notes.filter(n => slug(n.review) === slug(x.name));
const entryOf = x => info.entries.find(e => slug(e.review) === slug(x.name));
const sceneOfNote = n => (/\(([^()]+)\)\s*$/.exec(n?.option || '') || [])[1];
// -> { state, what, since, stale, rebuilding (the scene a signed-off review is redoing) }
function statusOf(x) {
  const e = entryOf(x), last = notesOf(x).reduce((a, n) => !a || Date.parse(n.at) >= Date.parse(a.at) ? n : a, null), p = printed?.reviews[slug(x.name)];
  const stale = !!e && Date.now() - Date.parse(e.since) > STALE_MS;
  const w = e ? { what: e.what, since: e.since, stale } : { what: last?.say || '', since: last?.at, stale: false };
  if (isLanded(x)) return { state: 'landed', ...w };
  if (last?.verdict === 'stop') return { state: 'signed', ...w, what: e?.what || '', since: e?.since, rebuilding: e ? sceneOfNote(last) : null };
  if (e) return { state: e.state === 'building' ? 'building' : 'iterating', ...w };
  if (last && !(p && p.since > last.at)) return { state: 'iterating', ...w };
  return { state: 'waiting', what: '', since: null, stale: false };
}
const COLS = [['waiting', 'Waiting on you', 1], ['iterating', 'Iterating', 0], ['building', 'Building', 0], ['signed', 'Signed off', 0]];
// Every review the board knows: the scenes' reviews plus any a status entry
// names that has no scenes yet (a mock still being made), a card with no options.
const allCards = () => [...reviews, ...info.entries.filter(e => !reviews.some(r => slug(r.name) === slug(e.review)))
  .map(e => ({ name: e.review, options: [], phantom: true }))];
const live = s => s.state === 'building' || s.state === 'iterating' || (s.state === 'signed' && s.what);
const inFlight = s => live(s) ? `<b>${esc(s.what || s.state)}</b> <span class="dim">since ${s.since ? hhmm(s.since) : '?'} (${s.since ? span(s.since) : '?'})${s.stale ? '' : ''}</span>${s.stale ? '<span class="stale">stale?</span>' : ''}` : 'none';
// the first word when it is a letter name (A, B1, current), else the whole label, cut by the chip's width
const chipLabel = l => /^([A-Za-z]d?|current)$/.test(l.split(' ')[0]) ? l.split(' ')[0] : l;
const mkHtml = k => k ? `<span class="mk ${k}">${k.toUpperCase()}</span>` : '';
// Board order: the cards a [ or ] steps through.
const boardOrder = () => {
  const cs = allCards().filter(x => !x.phantom), st = new Map(cs.map(x => [x, statusOf(x)]));
  const out = COLS.flatMap(([s]) => cs.filter(x => st.get(x).state === s));
  const landed = cs.filter(x => st.get(x).state === 'landed');
  return showLanded || (!out.length && landed.length) ? [...out, ...landed] : out;
};
function drawBoard() {
  const cs = allCards(), st = new Map(cs.map(x => [x, statusOf(x)]));
  const card = x => {
    const s = st.get(x), p = printed?.reviews[slug(x.name)], flag = x.phantom ? null : revFlag(x);
    const w = live(s) ? `${esc(s.what || s.state)} · since ${s.since ? hhmm(s.since) : '?'}${s.since ? ` (${span(s.since)})` : ''}`
      : p ? `ready · updated ${ago(p.since)}` : '';
    const chips = x.options.map(o => `<span class="chip ${s.rebuilding === o.scene ? 'rebuild' : ''}" title="${esc(o.label)}"><span class="cl">${esc(chipLabel(o.label))}</span> ${mkHtml(optKind(x, o))}</span>`).join('')
      || '<span class="dim">no options yet</span>';
    return `<button class="card ${x === rev ? 'sel' : ''} ${x.phantom ? 'phantom' : ''}" data-rev="${slug(x.name)}" data-state="${s.state}"><div class="t">${esc(x.name)}${flagHtml(flag)}</div>`
      + `<div class="w">${w}${s.stale ? '<span class="stale">stale?</span>' : ''}</div><div>${chips}</div></button>`;
  };
  const open = cs.filter(x => st.get(x).state !== 'landed'), landed = cs.filter(x => st.get(x).state === 'landed');
  let html = `<div class="kan">${COLS.map(([s, t, hot]) => {
    const C = open.filter(x => st.get(x).state === s);
    return `<div class="col ${hot ? 'hot' : ''}" data-state="${s}"><header><span>${t}</span><span>${C.length}</span></header><div class="cards">${C.map(card).join('') || '<span class="dim">none</span>'}</div></div>`;
  }).join('')}</div>`;
  if (landed.length) html += `<div class="landedrow" data-landed="${landed.length}">landed (${landed.length}): ${showLanded
    ? landed.map(x => `<button class="lr ${x === rev ? 'sel' : ''}" data-rev="${slug(x.name)}" title="landed: ${esc(landedOf(x)?.why || '')}">${esc(x.name)}</button>`).join('')
    : esc(landed.map(x => x.name).join(' · '))} <button id="landedtoggle">${showLanded ? 'hide' : 'show'}</button></div>`;
  $('board').innerHTML = html;
  for (const b of $('board').querySelectorAll('[data-rev]')) {
    const x = cs.find(c => slug(c.name) === b.dataset.rev);
    if (x && !x.phantom) b.onclick = () => show(b.dataset.rev);
  }
  const t = $('landedtoggle');
  if (t) t.onclick = () => { showLanded = !showLanded; try { localStorage.setItem(LANDED, showLanded ? '1' : '0'); } catch {} drawBoard(); };
  $('hint').textContent = boardOrder().length > 1 ? '[ ] between reviews, 1-9 options, r restart' : '1-9 options, r restart';
}
// The open review's heading, its in-flight line and its history: redrawn on every poll
function drawHead() {
  if (!rev) return;
  const s = statusOf(rev), p = printed?.reviews[slug(rev.name)];
  $('head').innerHTML = `<h2>${esc(rev.name)} <span class="pill s-${s.state}">${LBL[s.state]}</span>${flagHtml(revFlag(rev))} ${p ? `<span class="dim">updated ${ago(p.since)}</span>` : ''}</h2>`
    + `<div class="flight ${live(s) ? '' : 'none'}"><span class="dim">in flight:</span> ${inFlight(s)}</div>`;
  const ns = notesOf(rev).sort((a, b) => Date.parse(a.at) - Date.parse(b.at)).slice(-3), line = n => `${hhmm(n.at)} you: ${n.verdict === 'stop' ? 'stop' : 'keep iterating'}${n.say ? ` "${esc(n.say)}"` : ''}`;
  $('hist').innerHTML = `<b>last:</b> ${ns.length ? ns.reverse().map(line).join(' &nbsp;|&nbsp; ') : 'no note yet.'}`;
}
let loaded = true;   // true until the first review and option have stood

function show(r, scene) {
  const row = boardOrder();
  rev = reviews.find(x => slug(x.name) === r) || row[0] || reviews[reviews.length - 1];
  look('rev', slug(rev.name), printed?.reviews[slug(rev.name)], loaded);
  drawBoard(); drawHead();
  const st = rev.options[0].stage, k = kindOfStage(st);
  // BUILT or MOCK, said on the page (the owner, 2026-10-28: "im having a hard time distinguishing between the mocks and whats actually built")
  $('stage-say').innerHTML = st ? `${k ? `<span class="tag ${k}">${k.toUpperCase()}</span>` : ''}${esc(st.replace(/^(built|mock):\s*/i, ''))}` : '';
  $('bar').innerHTML = '';
  rev.options.forEach((o, i) => {
    const b = document.createElement('button'); b.dataset.scene = o.scene; b.dataset.n = i;
    b.onclick = () => stand(o.scene); $('bar').append(b);
  });
  const again = document.createElement('button'); again.textContent = 'r restart'; again.onclick = () => stand(cur); $('bar').append(again);
  stand(rev.options.some(o => o.scene === scene) ? scene : rev.options[0].scene);
}
function stand(scene) {
  // between two options of one review that both swap, flip the setting on the game standing: instant
  const was = cur, sameRev = was && rev.options.some(o => o.scene === was);
  cur = scene;
  const o = rev.options.find(x => x.scene === scene);
  history.replaceState(null, '', `#${slug(rev.name)}/${scene}`);
  look('opt', scene, printed?.options[scene], loaded); loaded = false;
  const reb = statusOf(rev).rebuilding;
  for (const b of $('bar').children) {
    b.classList.toggle('on', b.dataset.scene === scene);
    const ob = rev.options[b.dataset.n];
    if (ob) {
      b.classList.toggle('rebuild', reb === ob.scene);
      b.innerHTML = `${+b.dataset.n + 1} ${esc(ob.label)}${reb === ob.scene ? ' (rebuilding)' : ''} ${mkHtml(optKind(rev, ob))}${flagHtml(optFlag(ob))}`;
    }
  }
  $('say').textContent = o ? o.say : '';
  const from = rev.options.find(x => x.scene === was);
  if (!(sameRev && was !== scene && from?.swap && o?.swap && f.contentWindow.__sceneSwap?.(scene))) f.contentWindow.__scene(scene);
}
f.addEventListener('load', () => {
  const go = async () => {
    if (!ready()) return setTimeout(go, 50);
    // a scene marks old story beats done, and their notices would cover the picture
    const st = f.contentDocument.createElement('style'); st.textContent = '.toast{display:none!important}'; f.contentDocument.head.append(st);
    reviews = f.contentWindow.__reviews();
    if (!reviews.length) { $('detail').hidden = true; stage.outerHTML = '<p class="empty">No review is open. File scenes under one in src/scenes.js: <code>review: \'the question\', option: \'A name\'</code>.</p>'; return; }
    // the prints and the status first, so the first drawing carries the marks and the columns
    await Promise.all([fetchPrints(), fetchInfo()]);
    loaded = true;   // the frame alone can reload too, and that is a fresh look
    const { r, s } = parse();
    show(r, s);
    if (!poll) poll = setInterval(refresh, 8e3);
  };
  go();
});
// The board follows the owner's notes and the agents' entries without a reload.
let poll = null;
async function refresh() {
  if (!reviews.length) return;
  await Promise.all([fetchPrints(), fetchInfo()]);
  drawBoard(); drawHead();
}
addEventListener('keydown', e => {
  if (!rev || /TEXTAREA/.test(e.target.tagName)) return;
  const i = Number(e.key) - 1;
  if (i >= 0 && i < rev.options.length) stand(rev.options[i].scene);
  if (e.key === 'r') stand(cur);
  if (e.key === '[' || e.key === ']') {
    const row = boardOrder(), n = row.length;
    if (!n) return;
    const k = row.indexOf(rev);
    // off the board (a landed review stood by its address): ] goes to the first, [ to the last
    const to = k < 0 ? (e.key === ']' ? 0 : n - 1) : (k + (e.key === ']' ? 1 : n - 1)) % n;
    show(slug(row[to].name));
  }
});
// The decision, posted to the dev server; the agent waiting on it wakes when it lands.
async function decide(verdict) {
  if (!rev) return;
  const o = rev.options.find(x => x.scene === cur), words = $('words').value.trim();
  if (verdict === 'keep' && !words) { $('sent').textContent = 'say what to change first'; return; }
  try {
    const r = await fetch('/__review', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ review: rev.name, option: o ? `${o.label} (${o.scene})` : cur, verdict, say: words }) });
    if (!r.ok) throw new Error(r.status);
    $('words').value = ''; try { sessionStorage.removeItem(DRAFT); } catch {}
    $('sent').textContent = verdict === 'stop' ? `sent: stop on ${o ? o.label : cur}` : 'sent: keep iterating';
    await fetchInfo(); drawBoard(); drawHead();
  } catch (e) { $('sent').textContent = `not sent (${e.message}): is this the dev server?`; }
}
// An unsent note outlives the reload an edit brings (per tab, in the browser only).
const DRAFT = 'review-draft';
try { $('words').value = sessionStorage.getItem(DRAFT) || ''; } catch {}
$('words').addEventListener('input', () => { try { sessionStorage.setItem(DRAFT, $('words').value); } catch {} });
$('stop').onclick = () => decide('stop');
$('keep').onclick = () => decide('keep');
</script></body></html>
