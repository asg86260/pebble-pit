<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cards</title>
<link rel="stylesheet" href="/src/style.css">
<style>
  /* The page shell the boards expect, and nothing else: a card here is drawn by
     the same builder and the same stylesheet as one on the bench. */
  body { background: #fff; margin: 0; padding: 12px; }
  .page { position: static; display: block; width: 600px; }
  .variant { margin-bottom: 24px; }
  .variant h2 { font: 12px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase;
                margin: 0 0 8px; color: #555; }
</style>
</head>
<body>
<!-- The card bench: rows drawn on their own with no yard behind them. Open it at
     /cards.html, or shoot it:

       GAME=http://localhost:PORT/cards.html node tools/headless.mjs --shot out.png 1

     A row is a plain object -- name, unit, does, from/to, bill, rung/rungs --
     handed to `mountRows` (shop.js), so a card can be put up in any state a
     board could ever show it in, at once, side by side, without hiring the crew
     that would earn it. It exists for the same reason preview.html does: what a
     card looks like at the worst bill it can carry is a fact about the CSS, and
     a yard is a slow way to ask the CSS a question.

     The purse is set by hand below, so `have` and `short` read honestly: a
     card you could afford stands solid and one you could not stands dashed
     with the missing coin marked. -->
<!-- The ids board.js and shop.js take hold of at load, so their modules can be
     imported here. Nothing in them is drawn. -->
<div hidden><div id="apothboard"></div><div id="apothshop"></div><div id="board"></div><div id="c"></div><div id="casino"></div><div id="casinoshop"></div><div id="crewlistrows"></div><div id="modal"></div><div id="modalwash"></div><div id="modaltitle"></div><div id="modalclose"></div><div id="modalbooks"></div><div id="modalcrew"></div><div id="bookincome"></div><div id="booksky"></div><div id="bookcrew"></div><div id="booktally"></div><div id="crewshop"></div><div id="farmboard"></div><div id="farmshop"></div><div id="hidedone"></div><div id="house"></div><div id="looboard"></div><div id="looshop"></div><div id="panel"></div><div id="purse"></div><div id="quarryboard"></div><div id="quarryshop"></div><div id="raise"></div><div id="school"></div><div id="schoolshop"></div><div id="filter"></div><div id="filtershop"></div><div id="shackboard"></div><div id="shackshop"></div><div id="shop"></div><div id="statsboard"></div><div id="statsshop"></div><div id="tip"></div><div id="towerboard"></div><div id="towershop"></div></div>
<div id="out"></div>
<script type="module">
import { mountRows } from './src/shop.js';
import { S } from './src/state.js';
import { LADDER, TIER_BAND, TIER_RUNGS, TIER_OWN } from './src/config.js';
Object.assign(S, { stored: 9000, shards: 60, spores: 5000, sparks: 0, cores: 1, pinned: 'critchance' });

const pips = (at, of) => ({ rung: () => at, rungs: () => of });

// A ladder in bands at a level: `LADDER` pips in groups of `TIER_BAND`, the
// bill its band carries, and the work in seconds -- `billOf` turns that into
// the clock.
const ladder = (key, name, level, unit, does, from, to, bill, pct, work = 30, of = LADDER) =>
  ({ key, name, unit, does, pct, kind: 'rung', from: () => from, to: () => to,
     bill: () => bill, work: () => work, ...pips(level, of), group: TIER_BAND });

const rows = [
  ladder('carry', 'carry amount', LADDER - 1, 'px', 'hold', 5, 7, [['dust', 52], ['spore', 17], ['shard', 4]]),
  { key: 'auto', kind: 'rung', name: 'hold to mine', cost: () => 25, work: () => 5 },
  ladder('critchance', 'crit chance', LADDER - 1, '%', 'crit', 20, 23, [['dust', 5700], ['spore', 1900], ['shard', 471]]),
  { key: 'critmult', kind: 'rung', name: 'crit damage', unit: 'x', does: 'crit', from: () => 3, to: () => 4,
    bill: () => [['dust', 1000], ['spore', 333], ['shard', 83]], work: () => 5, ...pips(0, 3) },
  ladder('haulcarry', 'hauler carry', LADDER - 1, 'px', 'carry', 9, 13, [['dust', 614], ['spore', 205], ['shard', 51]]),
  ladder('haulpace', 'hauler speed', LADDER - 1, 'px/s', 'walk', 108, 118, [['dust', 1200], ['spore', 393], ['shard', 98]], true),
  ladder('power', 'balloon power', LADDER - 1, 'motes/s', 'filter', 40, 45, [['dust', 3300], ['spore', 1100]], true),
  ladder('balloonspeed', 'balloon speed', 3, 'x', 'filter', 1.6, 1.8, [['dust', 3000], ['spore', 900]]),
  ladder('bufflength', 'brew concentration', 1, 's', 'lasts', 73, 87, [['dust', 1440]]),
  // A ground ladder at its spark rung: the deepest bill in the game.
  ladder('crop', 'crop yield', TIER_OWN, 'spores/cut', 'cut', 7, 11,
         [['dust', 23000], ['shard', 1900], ['spore', 7700], ['core', 7], ['spark', 1150]], false, 120, TIER_RUNGS),
];

const out = document.getElementById('out');
const page = document.createElement('div'); page.className = 'page';
page.innerHTML = '<div class="title">the bench</div><div class="rows"></div>';
out.appendChild(page);
mountRows(page.querySelector('.rows'), rows);

</script>
</body>
</html>
