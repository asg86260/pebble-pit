<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boulder</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<!-- One menu, not two. It walks along the ground from the bench to the lab and
     shows whichever of them you are standing at. -->
<div id="panel" class="panel" hidden>
  <!-- what you have to spend, floated off the left of whichever board is open -->
  <div id="purse" class="purse"></div>
  <div class="sheet">
  <div id="board" class="page" hidden>
    <div class="title">the bench</div>
    <div id="shop" class="rows"></div>
    <button id="reset" type="button">reset progress</button>
  </div>
  <div id="lab" class="page" hidden>
    <div class="title">the lab</div>
    <div id="labshop" class="rows"></div>
  </div>
  <div id="school" class="page" hidden>
    <div class="title">the training grounds</div>
    <div class="note">upgrade workers to specialists</div>
    <div id="schoolshop" class="rows"></div>
  </div>
  <div id="house" class="page" hidden>
    <div class="title">the house</div>
    <div id="crewshop" class="rows"></div>
  </div>
  <div id="towerboard" class="page" hidden>
    <div class="title">the tower</div>
    <div id="towershop" class="rows"></div>
  </div>
  <div id="quarryboard" class="page" hidden>
    <div class="title">the quarry</div>
    <div id="quarryshop" class="rows"></div>
  </div>
  <div id="farmboard" class="page" hidden>
    <div class="title">the farm</div>
    <div id="farmshop" class="rows"></div>
  </div>
  <div id="scrub" class="page" hidden>
    <div class="title">the scrubbing house</div>
    <div id="scrubshop" class="rows"></div>
  </div>
  <div id="casino" class="page" hidden>
    <div class="title">the casino</div>
    <div id="casinoshop" class="rows"></div>
  </div>
  <!-- A ladder that is finished stays on the board saying so, because seeing
       that you are done is the point of a ladder having an end. Once there are
       a dozen of them that is a column of things you cannot buy, so this puts
       them away -- a preference rather than a rule, since both readings are
       true at different points in a game.

       It stands under the pages rather than on one of them, because the
       preference is not the bench's: every board in the yard grows ladders and
       finishes them, and the switch that folds them was reachable from exactly
       one of the nine. Out here it belongs to whichever board is open, and the
       next board added gets it without knowing it exists. -->
  <button id="hidedone" type="button">finished: shown</button>
  </div>
  <!-- The house board's submenu: the people, on a sheet of their own beside it.
       It is inside the panel rather than beside it so that it moves with the
       board, fades with the board, and -- the part that matters -- counts as
       part of the board to everything that asks whether the cursor is still on
       the menu. -->
  <div id="crewlist" class="sheet flyout" hidden>
    <!-- No title of its own: every other sheet here is a place you walked up to
         and says which one, and this is not a place -- it is the heading on the
         board next to it, opened out. So the heading it came from is the only
         thing written at the top of it, in the smaller of the two hands the
         boards use, because it belongs to that board rather than standing
         alongside it. -->
    <div id="crewlistrows" class="rows"></div>
  </div>
</div>

<!-- Held. In the middle of the window, because a game that has stopped should
     say so where you are already looking, not in a corner you have to find. -->
<div id="held" class="held" hidden>
  <div class="word">paused</div>
  <button id="resume" type="button">resume</button>
</div>

<div id="tip" hidden></div>

<canvas id="c"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
