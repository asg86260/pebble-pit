<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- installable: see play.html for why -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon.png">
<title data-l10n-id="title-doctitle">Pebble Pit</title>
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./src/style.css">
<link rel="stylesheet" href="./src/title.css">
<!-- Dark mode before the first paint, straight from the store, so the page
     never opens white and then goes dark. The same question prefs.js's
     `dark` asks, in the same order. -->
<script>
try {
  var d = /[?&]dark\b/.test(location.search) || null;
  if (d == null) { var p = JSON.parse(localStorage.getItem('boulder-clicker/prefs')); d = p && p.dark; }
  if (d == null) d = matchMedia('(prefers-color-scheme: dark)').matches;
  if (d) document.documentElement.classList.add('dark');
} catch (e) {}
</script>
</head>
<body class="title">
<!-- The landing page (DESIGN.md, "The landing page"). The picture is the
     game itself, in a frame, standing a staged yard nobody owns with every
     piece of chrome hidden (main.js, `demo`); nothing under the pointer.
     The menu is the column on the left, and each button opens in the column:
     one place, and the yard keeps moving behind it. -->
<iframe id="yard" class="yard" src="./play.html?demo" title="" tabindex="-1"></iframe>
<div class="col">
  <div class="gamename" data-l10n-id="title-gamename">pebble<br>pit</div>
  <div class="line" data-l10n-id="title-line">a rock. a hole. a few people between them.</div>

  <!-- the front -->
  <button id="play" type="button" class="play" data-pane="main" data-l10n-id="title-play">play</button>
  <div id="playlabel" class="sub" data-pane="main"></div>
  <button id="slotsbtn" type="button" data-pane="main" data-l10n-id="title-slotsbtn">saves</button>
  <button id="recordbtn" type="button" data-pane="main" data-l10n-id="title-recordbtn">achievements</button>
  <button id="settingsbtn" type="button" data-pane="main" data-l10n-id="title-settingsbtn">settings</button>
  <!-- the desk only: title.js gives it a pane when window.desk exists -->
  <button id="quit" type="button" hidden data-l10n-id="title-quit">exit to desktop</button>

  <!-- the saves: three rows, the open one marked; picking one opens it and
       turns back to the front; each row's delete clears that slot. The save
       going out and coming in act on the open slot's blob -->
  <div class="word" data-pane="slots" hidden data-l10n-id="title-slots-word">saves</div>
  <div id="slots" class="saves" data-pane="slots" hidden></div>
  <div class="pair" data-pane="slots" hidden>
    <button id="savecopy" type="button" data-l10n-id="title-savecopy">copy a save</button>
    <button id="loadsave" type="button" data-l10n-id="title-loadsave">load a save</button>
  </div>
  <div id="paste" class="paste" data-pane="slots" hidden>
    <textarea id="pastebox" rows="6" spellcheck="false"></textarea>
    <div class="pair">
      <button id="loadit" type="button" data-l10n-id="title-loadit">load it</button>
      <button id="nevermind" type="button" data-l10n-id="title-nevermind">never mind</button>
    </div>
  </div>
  <!-- the cloud's section, as on the held sheet's saves page (cloudsheet.js);
       a build with no cloud leaves it hidden -->
  <div id="cloudsheet" class="paste cloudsheet" data-pane="slots" hidden></div>
  <button id="slotsback" type="button" data-pane="slots" hidden data-l10n-id="title-slotsback">back</button>

  <!-- the record of the open yard, off its save -->
  <div class="word" data-pane="record" hidden data-l10n-id="title-record-word">achievements</div>
  <div id="record" class="record" data-pane="record" hidden></div>
  <button id="recordback" type="button" data-pane="record" hidden data-l10n-id="title-recordback">back</button>

  <!-- the settings, as on the held sheet -->
  <div class="word" data-pane="settings" hidden data-l10n-id="title-settings-word">settings</div>
  <button id="motion" type="button" data-pane="settings" hidden data-l10n-id="set-motion-full">motion: full</button>
  <button id="dark" type="button" data-pane="settings" hidden data-l10n-id="set-dark-off">dark: off</button>
  <button id="langbtn" type="button" data-pane="settings" hidden></button>
  <button id="sound" type="button" data-pane="settings" hidden data-l10n-id="set-sound-on">sound: on</button>
  <input id="volume" type="range" min="0" max="1" step="0.05" data-pane="settings" aria-label="volume" hidden data-l10n-id="set-volume">
  <button id="controlsbtn" type="button" data-pane="settings" hidden data-l10n-id="title-controlsbtn">controls</button>
  <button id="settingsback" type="button" data-pane="settings" hidden data-l10n-id="title-settingsback">back</button>
  <!-- the controls page: the rows are src/controls.js's -->
  <div class="word" data-pane="controls" hidden data-l10n-id="title-controls-word">controls</div>
  <div id="controlslist" class="controls" data-pane="controls" hidden></div>
  <button id="controlsback" type="button" data-pane="controls" hidden data-l10n-id="title-controlsback">back</button>
  <!-- the language page, as on the held sheet (langpage.js) -->
  <div class="word" data-pane="language" hidden data-l10n-id="title-lang-word"></div>
  <div id="langlist" class="langs" data-pane="language" hidden></div>
  <button id="langback" type="button" data-pane="language" hidden data-l10n-id="title-controlsback">back</button>

  <!-- two yards in one slot, one here and one in the cloud: the player
       keeps one (cloudsheet.js, `showConflicts`) -->
  <div class="word" data-pane="conflict" hidden data-l10n-id="title-conflict-word">choose a yard</div>
  <div id="clashes" class="slots clashes" data-pane="conflict" hidden></div>
  <button id="conflictback" type="button" data-pane="conflict" hidden data-l10n-id="title-conflictback">back</button>

  <div id="said" class="said" data-pane="main slots settings conflict"></div>
</div>
<!-- the way in (title.js, `play`): the page goes white before play.html is
     asked for, so the load gap between the two is the end of one fade and
     the start of the next rather than a cut -->
<div id="veil" class="veil up"></div>
<div class="foot">
  <!-- the build and the cloud's line beside it (cloudsheet.js, `showFoot`;
       DESIGN.md, "Linking a device") -->
  <span class="left"><span id="build"></span><span id="cloud" class="cloud" hidden></span></span>
  <!-- the language in force, in its own name: a player whose language was
       guessed wrong finds the way out without reading a word of it. Not in
       #links, which the desk hides -->
  <span><span id="links"><a href="https://cameldash.itch.io/pebble-pit" target="_blank" rel="noopener" data-l10n-id="title-link-itch">itch</a> &middot; <a href="https://github.com/asg86260/pebble-pit" target="_blank" rel="noopener" data-l10n-id="title-link-github">github</a> &middot; </span><button id="langfoot" type="button" class="langfoot"></button></span>
</div>
<script type="module" src="./src/title.js"></script>
</body>
</html>
