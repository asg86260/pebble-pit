<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebble Pit</title>
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./src/style.css">
<link rel="stylesheet" href="./src/title.css">
</head>
<body class="title">
<!-- The landing page (DESIGN.md, "The landing page"). The picture is the
     game itself, in a frame, standing a staged yard nobody owns with every
     piece of chrome hidden (main.js, `demo`); nothing under the pointer.
     The menu is the column on the left, and each button opens in the column:
     one place, and the yard keeps moving behind it. -->
<iframe id="yard" class="yard" src="./play.html?demo" title="" tabindex="-1"></iframe>
<div class="col">
  <div class="gamename">pebble<br>pit</div>
  <div class="line">a rock. a hole. a few people between them.</div>

  <!-- the front -->
  <button id="play" type="button" class="play" data-pane="main">play</button>
  <div id="playlabel" class="sub" data-pane="main"></div>
  <button id="slotsbtn" type="button" data-pane="main">saves</button>
  <button id="recordbtn" type="button" data-pane="main">achievements</button>
  <button id="settingsbtn" type="button" data-pane="main">settings</button>
  <!-- the desk only: title.js gives it a pane when window.desk exists -->
  <button id="quit" type="button" hidden>exit to desktop</button>

  <!-- the saves: three rows, the open one marked; picking one opens it, and
       nothing else happens here because no yard is running -->
  <div class="word" data-pane="slots" hidden>saves</div>
  <div id="slots" class="slots" data-pane="slots" hidden></div>
  <button id="slotsback" type="button" data-pane="slots" hidden>back</button>

  <!-- the record of the open yard, off its save -->
  <div class="word" data-pane="record" hidden>achievements</div>
  <div id="record" class="record" data-pane="record" hidden></div>
  <button id="recordback" type="button" data-pane="record" hidden>back</button>

  <!-- the settings, as on the held sheet; the save going out and coming in
       acts on the open slot's blob -->
  <div class="word" data-pane="settings" hidden>settings</div>
  <button id="motion" type="button" data-pane="settings" hidden>motion: full</button>
  <button id="sound" type="button" data-pane="settings" hidden>sound: on</button>
  <input id="volume" type="range" min="0" max="1" step="0.05" data-pane="settings" aria-label="volume" hidden>
  <div class="pair" data-pane="settings" hidden>
    <button id="savecopy" type="button">save a copy</button>
    <button id="loadsave" type="button">load a save</button>
  </div>
  <div id="paste" class="paste" data-pane="settings" hidden>
    <textarea id="pastebox" rows="6" spellcheck="false"></textarea>
    <div class="pair">
      <button id="loadit" type="button">load it</button>
      <button id="nevermind" type="button">never mind</button>
    </div>
  </div>
  <button id="reset" type="button" data-pane="settings" hidden>reset progress</button>
  <button id="settingsback" type="button" data-pane="settings" hidden>back</button>

  <div id="said" class="said" data-pane="main slots settings"></div>
</div>
<!-- the way in (title.js, `play`): the page goes white before play.html is
     asked for, so the load gap between the two is the end of one fade and
     the start of the next rather than a cut -->
<div id="veil" class="veil up"></div>
<div class="foot">
  <span id="build"></span>
  <span id="links"><a href="https://cameldash.itch.io/pebble-pit" target="_blank" rel="noopener">itch</a> &middot; <a href="https://github.com/asg86260/pebble-pit" target="_blank" rel="noopener">github</a></span>
</div>
<script type="module" src="./src/title.js"></script>
</body>
</html>
