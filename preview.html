<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>effects</title>
<style>
  html, body { margin: 0; background: #fff; color: #000;
               font: 12px/1.4 ui-monospace, "Courier New", monospace; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<!-- The effects bench: everything in render/effects.js, drawn on its own with no
     yard behind it. Open it at /preview.html, or shoot it:

       GAME=http://localhost:PORT/preview.html node tools/headless.mjs --shot out.png 1

     It exists because of what tuning the tonic plume cost the other way: open a
     yard, hire a crew, build the apothecary, set a pot, wait for a batch, and
     hope the body it dealt to walked into shot -- per attempt. Twice now the
     fault has been something a staged screenshot could not have shown: a lick
     that only reads wrong across several moments, and a plume whose shape is the
     path its emitter walked. -->
<canvas id="bench"></canvas>
<script type="module">
import { P, DOSE_MOTE_LIFE, DOSE_MOTE_MS, DOSE_MOTE_RISE } from './src/config.js';
import { drawDoseMote } from './src/render/effects.js';

const SCALE = 3;
const canvas = document.getElementById('bench');
const g = canvas.getContext('2d');

// The motes are simulated here, not imported: what ships is one pure draw per
// mote (`drawDoseMote`), and the rising and expiring belong to the yard's own
// puff. So the bench runs its own little emitter, on the same numbers, and what
// it is really showing you is the DRAW -- the colour, the size, the fade.
const TONICS = [['a hearty stew', '#5fb84f'], ['a bracing tonic', '#a05fd6'],
                ['a strong brew', '#4a86c7']];
// Off config.js, not copied from it. Written out here once, the bench went on
// showing the plume the game used to have the moment either number was tuned --
// which is the one thing a bench must never do.
const LIFE = DOSE_MOTE_LIFE * 1000;
const EVERY = DOSE_MOTE_MS;

// A plume, as a still: motes let go every EVERY ms from a head that is moving at
// `speed` px/ms, each risen by however long it has been in the air. Standing
// still that is a column; walking, it is the trail -- and the trail is the whole
// reason these are motes in the world rather than a flame drawn on a head.
function plume(gg, x, y, colour, speed) {
  for (let age = LIFE; age > 0; age -= EVERY) {
    const k = age / LIFE;
    for (const off of [-P * 0.7, P * 0.7]) {
      // Each mote its own variation, the way `puff` gives it one -- fixed per
      // mote, not per frame. Off a hash of its age and side rather than a random,
      // so the bench draws the same plume every time and two shots can be
      // compared. A bench that reshuffles is a bench you cannot A/B.
      const v = ((Math.sin(age * 12.9898 + off) * 43758.5453) % 1 + 1) % 1;
      gg.save();
      drawDoseMote(gg, x - speed * age + off + Math.sin(age / 90) * P * 0.4,
                   y - age * DOSE_MOTE_RISE / 16.7, colour, k, v);
      gg.restore();
    }
  }
}

const ROWS = [
  { what: 'standing still -- stew, tonic, brew',
    cells: TONICS.map(([, c]) => (gg, x, y) => plume(gg, x, y, c, 0)) },
  { what: 'walking -- the trail it leaves (slow, quicker, quickest)',
    cells: [0.04, 0.08, 0.14].map(v => (gg, x, y) => plume(gg, x, y, '#a05fd6', v)) },
  { what: 'one mote, new to gone',
    cells: [0, 0.5, 1].map(k => (gg, x, y) => drawDoseMote(gg, x, y, '#4a86c7', k)) },
  // The hue spread on its own: one tonic, one age, the whole range of variation
  // a mote may be let go with. This is the row that says whether the spread is
  // still plainly the tonic or has wandered off into another colour.
  { what: 'the hue a mote may start on -- across the spread',
    cells: [0, 1, 2].map(band => (gg, x, y) => {
      for (let i = 0; i < 7; i++) {
        const v = band === 0 ? i / 6 : band === 1 ? 0.5 : (i % 2 ? 0 : 1);
        drawDoseMote(gg, x + (i - 3) * P * 1.6, y, '#a05fd6', 0.1, v);
      }
    }) }
];

const CELL_W = P * 20, CELL_H = P * 8;
canvas.width = CELL_W * 3 * SCALE;
canvas.height = CELL_H * ROWS.length * SCALE;

function frame() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#fff';
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ROWS.forEach((row, r) => {
    g.fillStyle = '#000';
    g.font = '7px ui-monospace, monospace';
    g.fillText(row.what, 4, r * CELL_H + 9);
    row.cells.forEach((draw, c) => {
      draw(g, c * CELL_W + P * 10, r * CELL_H + CELL_H - P * 2);
    });
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// headless.mjs waits for this before it does anything, so say we are here.
window.__test = () => {};
</script>
</body>
</html>
